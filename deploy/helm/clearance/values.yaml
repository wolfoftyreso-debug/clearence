# CLEARANCE - standardvärden.
#
# Varje miljö överlagrar det den behöver i en egen values-fil
# (se values-prod.example.yaml). Hemligheter hör INTE hit i klartext -
# sätt existingSecret eller injicera via SOPS/Sealed Secrets. Se
# docs/selfhosted-kubernetes.md.

# Avbilderna. Byggs av Gitea Actions och pushas till Giteas registry.
image:
  registry: git.clearance.internal
  pullPolicy: IfNotPresent
  # Sätts per release till commit-SHA:t. "latest" är medvetet inte default.
  tag: ""
  api:
    repository: clearance/api
  frontend:
    repository: clearance/frontend
  worker:
    repository: clearance/worker
  migrate:
    repository: clearance/migrate
imagePullSecrets: []

# --- Icke-hemlig konfiguration (blir en ConfigMap) ----------------------
config:
  # Modellen bakom CLEARANCE-samtalet. Nyckeln är hemlig (se secrets).
  anthropicModel: "claude-sonnet-5"
  # pg-poolens tak i API:t.
  pgPoolMax: "10"
  # Antal BETRODDA mellanled framför API:t. Avgör vilken post i
  # x-forwarded-for som hastighetsgränsen räknar på - fel värde här gör
  # spärren mot lösenordsforcering verkningslös. 1 = nginx-sidovagnen.
  # Sätt 0 om API:t tar emot direkt (då ignoreras rubriken helt).
  trustedProxyHops: "1"
  # Sessionens livslängd i timmar.
  sessionTtlHours: "12"
  # Avsändaradress för utkorgen. Måste ligga under din domän.
  mailFrom: "faktura@clearance.se"
  # Bas för länkar i mejl (inbjudans acceptlänk m.m.).
  appBaseUrl: "https://clearance.se"
  # Mejltransport: "ses" (AWS/SES-kompatibel endpoint) eller "smtp".
  mailTransport: "smtp"
  # SES-region används bara när mailTransport=ses.
  sesRegion: "eu-north-1"
  # SMTP-inställningar (används bara när mailTransport=smtp). Lösenordet är
  # hemligt och bor i Secreten (nyckeln smtp-pass), inte här.
  smtpHost: ""
  smtpPort: "587"
  smtpSecure: "false"
  smtpUser: ""

# --- Hemligheter --------------------------------------------------------
# Antingen namnger du en redan skapad Secret (existingSecret) med rätt
# nycklar, ELLER låter chartet skapa en ur create.* (bara för test - lägg
# ALDRIG riktiga värden i git). Nycklar som förväntas i secreten:
#   database-url               clearance_api (medlem i authenticated, ALDRIG bypassrls)
#   worker-database-url        app_worker (bypassrls, betrodd batch-roll)
#   migrate-database-url       superanvändare (skapar roller/extensions)
#   selfhost-api-password      lösenord som migrera.sh sätter på clearance_api
#   selfhost-worker-password   lösenord som migrera.sh sätter på app_worker
#   anthropic-api-key          valfri (tom = samtalet ej anslutet)
#   google-maps-api-key        valfri
# selfhost-*-password måste matcha lösenorden i database-url/worker-database-url:
# migrations-jobbet SKAPAR rollerna med dem, appen ANSLUTER med URL:erna.
secret:
  existingSecret: ""
  create:
    databaseUrl: ""
    workerDatabaseUrl: ""
    migrateDatabaseUrl: ""
    selfhostApiPassword: ""
    selfhostWorkerPassword: ""
    anthropicApiKey: ""
    googleMapsApiKey: ""
    smtpPass: ""

# --- Självhostad Postgres via CloudNativePG -----------------------------
# Kräver att CNPG-operatorn är installerad i klustret. Sätt enabled=false
# och peka DATABASE_URL:erna mot en extern Postgres om du kör den utanför.
postgres:
  enabled: true
  instances: 2            # 1 primär + 1 standby (HA). 1 för en enda nod.
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4"
  storage:
    size: 20Gi
    storageClass: ""
  # Databasnamn + ägarroll som CNPG skapar. app_user/app_worker och rollerna
  # skapas av migrations-jobbet (db/bootstrap.sql), inte här.
  database: clearance
  owner: clearance_owner
  # PITR-backup till MinIO/S3 (rekommenderas separat lagringsmål i prod).
  backup:
    enabled: false
    destinationPath: ""
    endpointURL: ""
    s3Credentials:
      existingSecret: ""

# --- MinIO (S3-kompatibel objektlagring för dokument) -------------------
# API:t signerar kortlivade nedladdnings-URL:er mot den här lagringen
# (api/server/storage.ts). storage_path lämnar aldrig servern - bara en
# presignerad GET-URL som går ut på 60 s, efter app.may_read_document().
minio:
  enabled: true
  image: "quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z"
  storage:
    size: 20Gi
    storageClass: ""
  # Skapa via existingSecret med nycklarna root-user/root-password.
  auth:
    existingSecret: ""
  bucket: clearance-documents

# --- Dokumentlagringens anslutning (S3/MinIO) ---------------------------
# Vad API:t signerar mot. När minio.enabled=true ärvs allt automatiskt från
# den interna MinIO-tjänsten - lämna då detta tomt. Sätt värden för att peka
# på AWS S3 (tom endpoint) eller en extern MinIO i stället.
documents:
  bucket: ""          # tom = ärver minio.bucket
  endpoint: ""        # tom + minio.enabled = intern MinIO; tom utan minio = AWS S3
  region: "eu-north-1"
  forcePathStyle: ""  # tom = true när endpoint satt (MinIO), annars false (AWS)
  # S3-nycklarna. Tom existingSecret = ärver MinIO:s rotcredentials.
  credentials:
    existingSecret: ""
    accessKeyIdKey: "root-user"
    secretAccessKeyKey: "root-password"

# --- API ----------------------------------------------------------------
api:
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# --- Frontend (nginx: SPA + /v1-proxy till API:t) -----------------------
frontend:
  replicaCount: 2
  port: 8080
  # Tom API-bas = samma origin (nginx proxar /v1). Låt den vara tom.
  apiBaseUrl: ""
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# --- Arbetarna ----------------------------------------------------------
# E-postarbetaren körs som CronJobs, en per flagga. Tiderna är i UTC om
# timeZone inte sätts; k8s 1.27+ stöder spec.timeZone.
worker:
  timeZone: "Europe/Stockholm"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # Namn → schema (cron) + argument. Speglar infra/main.tf.
  jobs:
    - name: send
      schedule: "*/5 * * * *"
      args: []
    - name: remind
      schedule: "0 * * * *"
      args: ["--remind"]
    - name: close
      schedule: "15 2 * * *"
      args: ["--close"]
    - name: gallra
      schedule: "0 3 * * *"
      args: ["--gallra"]
    - name: credit
      schedule: "30 4 * * *"
      args: ["--credit"]
    - name: invoice-referrals
      schedule: "0 5 1 * *"
      args: ["--invoice-referrals"]
    - name: invoice-usage
      schedule: "0 6 1 * *"
      args: ["--invoice-usage"]
  # Aviseringsarbetaren: egen binär, egen avbild (deploy/notification/Dockerfile,
  # byggd av CI). Använder samma mejltransport (MAIL_TRANSPORT) och 46elks för
  # SMS via integration_secrets. Kör kontinuerligt (var 5:e minut internt).
  notification:
    enabled: true
    image:
      repository: clearance/notification-worker

# --- Migrations-jobbet (Helm-hook före install/upgrade) -----------------
migrate:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# --- Ingång -------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: clearance.example
  annotations: {}
  tls:
    enabled: true
    # cert-manager-utfärdare. Tom = ingen automatisk utfärdning (egen CA).
    clusterIssuer: "letsencrypt-prod"
    secretName: clearance-tls

# --- Nätpolicyer (default deny + de tillåtna flödena) -------------------
networkPolicy:
  enabled: true

# Pod-säkerhet: kör aldrig som root, tappa alla capabilities.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
