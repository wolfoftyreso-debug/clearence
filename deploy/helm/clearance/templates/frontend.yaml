apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clearance.fullname" . }}-frontend
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "clearance.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clearance.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "clearance.image" (dict "ctx" . "repository" .Values.image.frontend.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # Samma origin: nginx proxar /v1 till API-tjänsten.
            - name: API_UPSTREAM
              value: "http://{{ include "clearance.fullname" . }}-api:{{ .Values.api.port }}"
            # Tom = relativ fetch mot samma origin. Injiceras i index.html.
            - name: API_BASE_URL
              value: {{ .Values.frontend.apiBaseUrl | quote }}
          securityContext:
            # nginx-unprivileged kör som uid 101. Rootfs får INTE vara
            # skrivskyddad här: entrypointen skriver om index.html vid start
            # (runtime-konfigen) och nginx skriver cache/temp.
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clearance.fullname" . }}-frontend
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "clearance.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
