{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clearance.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Körs FÖRE API:t rullas, vid varje install och upgrade. Migrera.sh är
    # idempotent (schema_migrations), så en omkörning är ofarlig.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "clearance.selectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "clearance.image" (dict "ctx" . "repository" .Values.image.migrate.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # SUPERANVÄNDARE: skriptet skapar roller, extensions och scheman
            # (db/bootstrap.sql). app_user räcker inte.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "clearance.secretName" . }}
                  key: migrate-database-url
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
