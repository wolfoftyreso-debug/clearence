{{- if not .Values.secret.existingSecret }}
# Skapas BARA när ingen existingSecret angetts. Lägg aldrig riktiga värden i
# git - det här är för test/bootstrap. I drift: sätt secret.existingSecret
# och hantera värdena med SOPS/Sealed Secrets. Se docs/selfhosted-kubernetes.md.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clearance.fullname" . }}-secrets
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secret.create.databaseUrl krävs när ingen existingSecret angetts" .Values.secret.create.databaseUrl | quote }}
  worker-database-url: {{ default .Values.secret.create.databaseUrl .Values.secret.create.workerDatabaseUrl | quote }}
  migrate-database-url: {{ default .Values.secret.create.databaseUrl .Values.secret.create.migrateDatabaseUrl | quote }}
  anthropic-api-key: {{ .Values.secret.create.anthropicApiKey | quote }}
  google-maps-api-key: {{ .Values.secret.create.googleMapsApiKey | quote }}
{{- end }}
