{{- $ := . -}}
{{- range .Values.worker.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "clearance.fullname" $ }}-worker-{{ .name }}
  labels:
    {{- include "clearance.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  schedule: {{ .schedule | quote }}
  {{- if $.Values.worker.timeZone }}
  timeZone: {{ $.Values.worker.timeZone | quote }}
  {{- end }}
  # Aldrig två körningar av samma jobb samtidigt. Dubblettskyddet bor i
  # databasen, men två samtidiga körningar vore ändå bortkastat arbete.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "clearance.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 12 }}
            clearance.se/job: {{ .name }}
        spec:
          restartPolicy: OnFailure
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: worker
              image: {{ include "clearance.image" (dict "ctx" $ "repository" $.Values.image.worker.repository) }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              args:
                {{- range .args }}
                - {{ . | quote }}
                {{- end }}
              env:
                - name: NODE_ENV
                  value: "production"
                # Arbetaren kör som app_worker, aldrig app_user.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "clearance.secretName" $ }}
                      key: worker-database-url
                # SMTP-lösenordet (används bara när MAIL_TRANSPORT=smtp).
                - name: SMTP_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "clearance.secretName" $ }}
                      key: smtp-pass
                      optional: true
              envFrom:
                - configMapRef:
                    name: {{ include "clearance.fullname" $ }}-config
              securityContext:
                {{- toYaml $.Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml $.Values.worker.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
{{- if .Values.worker.notification.enabled }}
---
# Aviseringsarbetaren: en egen binär (notification-worker.cjs), egen avbild.
# Kör kontinuerligt (var 5:e minut internt), därav en Deployment, inte CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clearance.fullname" . }}-notification-worker
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "clearance.selectorLabels" (dict "ctx" . "component" "notification-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clearance.selectorLabels" (dict "ctx" . "component" "notification-worker") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notification-worker
          image: {{ include "clearance.image" (dict "ctx" . "repository" .Values.worker.notification.image.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "clearance.secretName" . }}
                  key: worker-database-url
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "clearance.secretName" . }}
                  key: smtp-pass
                  optional: true
          envFrom:
            - configMapRef:
                name: {{ include "clearance.fullname" . }}-config
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

{{- if .Values.worker.simulation.enabled }}
---
# SIMULERINGSARBETAREN.
#
# Monte Carlo-körningar över motorns tröskel (TROSKEL_FOR_KO) köas i
# stället för att räknas i API-processen: API:t är enprocessigt, och en
# miljon iterationer tar dryga två sekunder - i en handler blir det två
# sekunders kö för varje annan användares anrop.
#
# CronJob varje minut och inte en Deployment: kön är oftast tom, och en
# process som sover kostar minne dygnet runt. Ett jobb som startar, tömmer
# det som finns och avslutar passar arbetsformen.
#
# concurrencyPolicy: Forbid räcker som lås tillsammans med
# claim_simulation_runs(), som tar raderna med `for update skip locked` -
# två samtidiga arbetare kan alltså aldrig ta samma körning.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "clearance.fullname" . }}-simulation-worker
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation-worker
spec:
  schedule: {{ .Values.worker.simulation.schedule | quote }}
  {{- if .Values.worker.timeZone }}
  timeZone: {{ .Values.worker.timeZone | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Taket i klustret ska ligga ÖVER arbetarens eget (SIM_MAX_MS), så
      # att en långsam körning hinner skriva "failed" innan Kubernetes
      # dödar podden. En dödad pod lämnar raden i 'running' för alltid.
      activeDeadlineSeconds: {{ .Values.worker.simulation.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "clearance.selectorLabels" (dict "ctx" . "component" "simulation-worker") | nindent 12 }}
        spec:
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: simulation-worker
              image: {{ include "clearance.image" (dict "ctx" . "repository" .Values.worker.simulation.image.repository) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: NODE_ENV
                  value: "production"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "clearance.secretName" . }}
                      key: worker-database-url
                - name: SIM_BATCH
                  value: {{ .Values.worker.simulation.batch | quote }}
                - name: SIM_MAX_MS
                  value: {{ .Values.worker.simulation.maxMs | quote }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.worker.simulation.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
