{{- if .Values.minio.enabled }}
# MinIO: S3-kompatibel objektlagring för dokumenten (signerade URL:er).
#
# API:t signerar kortlivade nedladdnings-URL:er hit (api/server/storage.ts);
# api-deploymenten pekas hit automatiskt via documents.* (endpoint +
# forcePathStyle) när minio.enabled=true.
# En enkel enkelnod; produktion vill ha MinIO-operatorn eller distribuerat.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clearance.fullname" . }}-minio
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.minio.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clearance.fullname" . }}-minio
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "clearance.selectorLabels" (dict "ctx" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clearance.selectorLabels" (dict "ctx" . "component" "minio") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "minio.auth.existingSecret krävs när minio.enabled=true" .Values.minio.auth.existingSecret }}
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.auth.existingSecret }}
                  key: root-password
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "clearance.fullname" . }}-minio
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clearance.fullname" . }}-minio
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  selector:
    {{- include "clearance.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
    - { name: console, port: 9001, targetPort: console }
{{- end }}
