apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clearance.fullname" . }}-config
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
data:
  # Delas av API:t och arbetarna. Inget hemligt här - hemligheterna bor i
  # Secreten och injiceras separat.
  ANTHROPIC_MODEL: {{ .Values.config.anthropicModel | quote }}
  PGPOOL_MAX: {{ .Values.config.pgPoolMax | quote }}
  SESSION_TTL_HOURS: {{ .Values.config.sessionTtlHours | quote }}
  MAIL_FROM: {{ .Values.config.mailFrom | quote }}
  APP_BASE_URL: {{ .Values.config.appBaseUrl | quote }}
  MAIL_TRANSPORT: {{ .Values.config.mailTransport | quote }}
  SES_REGION: {{ .Values.config.sesRegion | quote }}
