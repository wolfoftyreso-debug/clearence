# Grinden. Körs på varje push och varje pull request.
#
# Den kör exakt det startkontrollen kör lokalt, i samma ordning, så att
# "det funkar hos mig" och "det funkar i CI" inte kan betyda olika saker.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # Lint, typer och hela enhetsbatteriet ligger i "npm test".
      - name: Enhetsbatteriet
        run: npm test

      - name: Byggen
        run: |
          VITE_DEMO_MODE=false npx vite build
          npm run build:worker

      # Produktionsbunten får aldrig bära demoläget.
      - name: Inget demoläge i bunten
        run: |
          if grep -rq "DEMOLÄGE" dist/assets/*.js; then
            echo "::error::demoläget finns i produktionsbunten"; exit 1
          fi

      # Serverkoden byggs inte till en avbild längre - Vercel bygger den.
      # Men den ska ändå typkontrolleras, och det gör "npm test" ovan via
      # tsconfig.server.json.

  databas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prov
          POSTGRES_DB: clearance
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:prov@127.0.0.1:5432/clearance
      # db/tests/run.sh och server/tests/run.sh bygger sina egna
      # psql-anrop ur PGHOST/PGPORT/PGUSER och faller annars tillbaka på
      # utvecklingsmaskinens unix-socket - alltså på ingenting här.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: prov
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # Migrationerna ska gå igenom på en TOM databas, i namnordning.
      # Det är den enda körning som liknar en ny miljö.
      - name: Migrationerna på tom databas
        run: scripts/migrera.sh

      - name: Databassviterna
        run: npm run test:selfhosted

      - name: API-sviterna
        run: npm run test:api

  webblasare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # SAMMA KOMMANDO SOM UTVECKLAREN KÖR.
      #
      # Här stod bygget och slingan utskrivna en gång till. Två
      # implementationer av samma sak driver isär, och den här hade redan
      # gjort det: bygget saknade Supabase-platshållarna som klienten
      # kräver vid modulinladdning, så sidan hade fallit på
      # "supabaseUrl is required" och VARJE svit blivit röd med
      # "Timeout 30000ms exceeded" - ett fel som ser ut som ett trasigt
      # gränssnitt men är ett trasigt bygge.
      #
      # scripts/kor-webblasarprov.sh bygger rätt, reser servern och kör
      # alla sviterna. Den är dessutom det som faktiskt underhålls.
      - name: Alla webbläsarsviter
        run: npm run test:webblasare
