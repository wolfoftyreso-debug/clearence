# Driftsättningen. Startas FÖR HAND, aldrig av en push.
#
# Varför för hand: den här produkten har inga kunder ännu, och den dag den
# har det är en oavsiktlig driftsättning mitt i en rekonstruktion inte
# värd bekvämligheten av automatik. När piloten är igång och CI har
# bevisat sig kan triggern flyttas till taggar.
#
# INGA LÅNGLIVADE NYCKLAR. Autentiseringen sker med OIDC mot en roll i
# AWS-kontot; det finns alltså ingen AWS-hemlighet att läcka härifrån.
# Rollen sätts upp en gång, se docs/driftsattning.md.
name: Driftsätt

on:
  workflow_dispatch:
    inputs:
      miljo:
        description: "Miljö"
        required: true
        default: "staging"
        type: choice
        options: ["staging", "prod"]
      migrera:
        description: "Kör migrationerna"
        required: true
        default: true
        type: boolean

permissions:
  id-token: write   # krävs för OIDC
  contents: read

concurrency:
  # Två samtidiga driftsättningar mot samma miljö är hur en halv version
  # hamnar i produktion. De köar i stället.
  group: driftsatt-${{ inputs.miljo }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1

jobs:
  driftsatt:
    runs-on: ubuntu-latest
    environment: ${{ inputs.miljo }}   # kräver godkännande om miljön har det
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # Grinden en gång till. CI kan ha kört på en annan commit.
      - name: Enhetsbatteriet
        run: npm test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Bygg och tryck avbilderna
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAGG: sha-${{ github.sha }}
        run: |
          docker build -f api/Dockerfile -t "$REG/clearance-api:$TAGG" .
          docker build -f db/Dockerfile  -t "$REG/clearance-worker:$TAGG" .
          docker push "$REG/clearance-api:$TAGG"
          docker push "$REG/clearance-worker:$TAGG"

      # Migrationerna FÖRE den nya koden rullas ut. Ett schema som ligger
      # efter koden ger fel som ser ut som buggar; ett schema som ligger
      # före är bara ett schema med oanvända kolumner.
      - name: Migrationerna
        if: ${{ inputs.migrera }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: scripts/migrera.sh

      - name: Rulla ut API och arbetare
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAGG: sha-${{ github.sha }}
        run: |
          terraform -chdir=infra init
          terraform -chdir=infra apply -auto-approve \
            -var="enable_compute=true" \
            -var="api_image=$REG/clearance-api:$TAGG" \
            -var="worker_image=$REG/clearance-worker:$TAGG"

      - name: Bygg och lägg upp frontenden
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DATA_ADAPTER: aws
          VITE_DEMO_MODE: "false"
        run: |
          npx vite build
          BUCKET=$(terraform -chdir=infra output -raw frontend_bucket)
          # Hashade tillgångar är oföränderliga och cachas hårt. index.html
          # får ALDRIG cachas: det är den som pekar ut vilken version som
          # gäller, och en cachad index.html låser besökare vid ett gammalt
          # bygge tills cachen råkar gå ut.
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude index.html --exclude sw.js \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,must-revalidate"
          # Service-workern samma sak: cachas den kan en trasig worker
          # aldrig ersättas.
          aws s3 cp dist/sw.js "s3://$BUCKET/sw.js" \
            --cache-control "no-cache,must-revalidate"
          DIST=$(terraform -chdir=infra output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"

      - name: Rökprov mot skarp miljö
        run: |
          BAS="${{ vars.VITE_API_BASE_URL }}"
          for i in $(seq 1 20); do
            kod=$(curl -s -o /dev/null -w '%{http_code}' "$BAS/v1/health") || kod=000
            [ "$kod" = "200" ] && echo "API:t svarar" && exit 0
            sleep 10
          done
          echo "::error::API:t svarade aldrig 200 på /v1/health"; exit 1
