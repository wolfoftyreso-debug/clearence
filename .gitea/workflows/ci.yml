# Gitea Actions - grinden och bygget, helt egenhostat.
#
# Samma gates som .github/workflows/ci.yml (Gitea Actions delar syntax med
# GitHub Actions), plus två saker som hör den egenhostade stacken till:
#   - helm lint/template på chartet (fångar mallfel innan drift).
#   - bygger de fyra avbilderna och pushar till Giteas EGET register.
#
# Runnern (act_runner) måste tillhandahålla en "ubuntu-latest"-etikett och
# docker. Registerpushen sker bara när repo-variabeln REGISTRY är satt.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Enhetsbatteriet
        run: npm test
      - name: Byggen
        run: |
          VITE_DEMO_MODE=false npx vite build
          npm run build:api
          npm run build:worker
          npm run build:notification-worker
      - name: Inget demoläge i bunten
        run: |
          if grep -rq "DEMOLÄGE" dist/assets/*.js; then
            echo "::error::demoläget finns i produktionsbunten"; exit 1
          fi
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - name: Helm - lint och render
        run: |
          helm lint deploy/helm/clearance
          # Render mot exempelvärdena: fångar mallfel utan ett kluster.
          helm template clearance deploy/helm/clearance \
            -f deploy/helm/clearance/values-prod.example.yaml \
            --set secret.existingSecret=clearance-secrets \
            --set minio.auth.existingSecret=clearance-minio \
            --set image.tag=ci > /dev/null

  # SÄKERHETSGRINDEN. Faller den här går ingenting i drift.
  #
  # Grinden prövar det som inte får slinka igenom på en tisdag: en secret som
  # råkat committas, ett kritiskt beroenderåd, och hela tests/sakerhet.ts -
  # SSRF, hastighetsgränsens nyckel, säkerhetsrubrikerna, CORS.
  sakerhet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hela historiken - en secret som togs bort finns kvar bakåt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Säkerhetssviten (angreppen ska BLOCKERAS)
        run: npm run test:sakerhet

      - name: Inga secrets i historiken
        run: |
          # Mönstren är de som ger direkt åtkomst om de läcker. En träff är
          # ett stopp: nyckeln ska betraktas som komprometterad och roteras.
          MONSTER='sk-ant-api[0-9]{2}-|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}'
          if git log -p --all | grep -nE "$MONSTER" | grep -v "^\s*[-+]\s*\*" | head -5 | grep -q .; then
            echo "::error::en secret finns i git-historiken - rotera den och skriv om historiken"
            exit 1
          fi
          echo "inga secrets i historiken"

      - name: Inga spårade .env-filer
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.[^e]' ; then
            echo "::error::en .env-fil är spårad i git"; exit 1
          fi
          echo "inga spårade .env-filer"

      - name: Beroenderåd - kritiska blockerar
        run: |
          # Kritiska råd stoppar bygget. Moderate/high i BYGGKEDJAN (vite,
          # esbuild) är utvärderade i SECURITY.md och når inte produktions-
          # artefakten; de rapporteras men fäller inte grinden.
          npm audit --audit-level=critical --omit=dev || {
            echo "::error::kritiskt beroenderåd i produktionsberoendena"; exit 1; }
          echo "--- fullt läge, för synlighet ---"
          npm audit || true

      - name: Ingen serversecret i frontendbunten
        run: |
          VITE_DEMO_MODE=false npx vite build >/dev/null
          if grep -rlE 'sk-ant-api|AKIA[0-9A-Z]{16}|service_role|BEGIN [A-Z ]*PRIVATE KEY' dist/assets/ 2>/dev/null | head -1 | grep -q .; then
            echo "::error::en serversecret ligger i frontendbunten"; exit 1
          fi
          echo "frontendbunten är ren"

  databas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prov
          POSTGRES_DB: clearance
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:prov@127.0.0.1:5432/clearance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Migrationerna på tom databas
        run: scripts/migrera.sh
      - name: Databassviterna
        run: npm run test:selfhosted
      - name: API-sviterna
        run: npm run test:api

  avbilder:
    # Bygger och (om ett register finns) pushar de fyra avbilderna.
    # sakerhet är med MED FLIT: en grind som inte blockerar bygget är
    # dokumentation, inte en grind.
    needs: [prova, sakerhet, databas]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REGISTRY: ${{ vars.REGISTRY }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Logga in i Giteas register
        if: ${{ vars.REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITEA_TOKEN }}
      - name: Bygg (och pusha) avbilderna
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: ${{ vars.REGISTRY != '' }}
          tags: ${{ vars.REGISTRY }}/clearance/api:${{ github.sha }}
      - name: Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: db/Dockerfile
          push: ${{ vars.REGISTRY != '' }}
          tags: ${{ vars.REGISTRY }}/clearance/worker:${{ github.sha }}
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend/Dockerfile
          push: ${{ vars.REGISTRY != '' }}
          tags: ${{ vars.REGISTRY }}/clearance/frontend:${{ github.sha }}
      - name: Migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/migrate/Dockerfile
          push: ${{ vars.REGISTRY != '' }}
          tags: ${{ vars.REGISTRY }}/clearance/migrate:${{ github.sha }}
      - name: Notification-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/notification/Dockerfile
          push: ${{ vars.REGISTRY != '' }}
          tags: ${{ vars.REGISTRY }}/clearance/notification-worker:${{ github.sha }}
